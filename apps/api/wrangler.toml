name = "football-empire-api-staging"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "allow_eval_during_startup"]
preview_urls = true

[vars]
APP_ENV = "staging"
ENVIRONMENT = "staging"
NODE_ENV = "production"
CORS_ORIGINS = "https://football-empire-web-staging.mshmahyar9.workers.dev"

# Preserve the migration history for isolated Preview builds. Free-plan
# Durable Objects must be introduced as SQLite-backed classes; the following
# v2 migration removes this legacy class from the final Worker configuration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["MatchCoordinator"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# Cloudflare Build Preview requires an explicit, isolated Preview variable set.
# Keep these values staging-scoped; secrets and production resources are not copied.
[previews.vars]
APP_ENV = "staging"
ENVIRONMENT = "staging"
NODE_ENV = "production"
CORS_ORIGINS = "https://football-empire-web-staging.mshmahyar9.workers.dev"
