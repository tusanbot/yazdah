name = "football-empire-api-staging"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "allow_eval_during_startup"]
preview_urls = false

[vars]
APP_ENV = "staging"
ENVIRONMENT = "staging"
NODE_ENV = "production"
CORS_ORIGINS = "https://football-empire-web-staging.workers.dev"

# Keep the migration ledger aligned with the deployed Worker. The remote Worker
# is already at v1 and owns the MatchCoordinator namespace. Declare that
# original creation before deleting the class in v2; a deletion-only migration
# is invalid because Wrangler otherwise has no local history for the class.
[[migrations]]
tag = "v1"
new_classes = ["MatchCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["MatchCoordinator"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
