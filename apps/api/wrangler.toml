name = "football-empire-api-staging"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-23"
# Fastify's readiness promise is shared by the Worker module; allow it to
# settle even when the request that first created it has already completed.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "allow_eval_during_startup", "handle_cross_request_promise_resolution"]
preview_urls = false

[vars]
APP_ENV = "staging"
ENVIRONMENT = "staging"
NODE_ENV = "production"
CORS_ORIGINS = "https://football-empire-web-staging.mshmahyar9.workers.dev"

# Keep the migration ledger aligned with the deployed Worker. Its remote
# migration tag is v2; omitting v2 makes Wrangler replay v1 and attempt to
# recreate a legacy Durable Object namespace on the Free plan.
[[migrations]]
tag = "v1"
new_classes = ["MatchCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["MatchCoordinator"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
