# Build this Next.js app with OpenNext for Cloudflare first.
# Expected output: .open-next/worker.js and .open-next/assets
name = "yazdah-miniapp-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
