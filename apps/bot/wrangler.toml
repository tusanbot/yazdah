name = "football-empire-bot-staging"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[vars]
APP_ENV = "staging"
TELEGRAM_MINI_APP_URL = "https://football-empire-web-staging.workers.dev"
YAZDAH_API_URL = "https://football-empire-api-staging.workers.dev"

# BotUpdateGuard was created by the historical v1 Worker. Current bot code
# no longer uses it, so retire the staging namespace in v2 rather than keeping
# a stale binding or exporting a placeholder class.
[[migrations]]
tag = "v1"
new_classes = ["BotUpdateGuard"]

[[migrations]]
tag = "v2"
deleted_classes = ["BotUpdateGuard"]

[observability]
enabled = true
