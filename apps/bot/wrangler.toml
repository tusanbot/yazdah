name = "football-empire-bot-staging"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]

[vars]
APP_ENV = "staging"
TELEGRAM_MINI_APP_URL = "https://football-empire-web-staging.mshmahyar9.workers.dev"
YAZDAH_API_URL = "https://football-empire-api-staging.mshmahyar9.workers.dev"

# Keep the historical Durable Object migration ledger aligned with the deployed
# Worker. v2 retired the legacy class; omitting it causes Wrangler to replay v1.
[[migrations]]
tag = "v1"
new_classes = ["BotUpdateGuard"]

[[migrations]]
tag = "v2"
deleted_classes = ["BotUpdateGuard"]

[observability]
enabled = true
