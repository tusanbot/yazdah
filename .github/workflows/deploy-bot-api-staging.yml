name: Deploy Yazdah bot and API staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch or commit to deploy to staging"
        required: true
        type: choice
        options:
          - refactor/unified-telegram-worker
        default: refactor/unified-telegram-worker

permissions:
  contents: read

concurrency:
  group: yazdah-bot-api-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build workspace
        run: pnpm build

      - name: Verify staging deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy API staging Worker
        run: pnpm --dir apps/miniapp exec wrangler deploy --config ../api/wrangler.toml

      - name: Deploy Telegram bot staging Worker
        run: pnpm --dir apps/miniapp exec wrangler deploy --config ../bot/wrangler.toml
