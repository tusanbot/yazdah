name: Yazdah staging fix validation

on:
  push:
    branches:
      - fix/telegram-miniapp-onboarding
  pull_request:
    branches:
      - cloudflare/staging-workers

permissions:
  contents: read

concurrency:
  group: yazdah-staging-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, test, typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
