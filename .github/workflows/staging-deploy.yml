name: Deploy Cloudflare staging

on:
  push:
    branches:
      - cloudflare/staging-workers
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yazdah-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: https://football-empire-api-staging.mshmahyar9.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate workspace build
        run: pnpm build
      - name: Build Mini App for Cloudflare Workers
        run: pnpm --filter @yazdah/miniapp exec opennextjs-cloudflare build
      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build passed. Deployment skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured as a GitHub Actions secret."
          fi
      - name: Deploy API staging Worker
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        run: pnpm --filter @yazdah/miniapp exec wrangler deploy --config ../api/wrangler.toml
      - name: Deploy Telegram bot staging Worker
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        run: pnpm --filter @yazdah/miniapp exec wrangler deploy --config ../bot/wrangler.toml
      - name: Deploy Mini App and scheduled game processing staging Worker
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        run: pnpm --filter @yazdah/miniapp exec opennextjs-cloudflare deploy --config wrangler.jsonc
